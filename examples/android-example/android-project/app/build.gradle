plugins {
    id 'com.android.application'
}

android {
    namespace = "org.libsdl.helloworld"
    compileSdk = 35

    defaultConfig {
        applicationId = 'org.libsdl.SDL_Helloworld'
        minSdk = 34
        targetSdk = 35
        versionCode = 1
        versionName = '1.0'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_PLATFORM=android-34', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = 'src/main/c/CMakeLists.txt'
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        prefab = true
    }
}

// builds the zig static lib into src/main/c/prebuilt/<abi>/ before CMake links it
['Debug': 'Debug', 'Release': 'ReleaseFast'].each { variant, optimize ->
    def zigTask = tasks.register("zigBuild${variant}", Exec) {
        workingDir file('../../zig-project')
        executable project.findProperty('zig') ?: 'zig'
        args 'build', 'lib', "-Doptimize=${optimize}", "-Dandroid_ndk=${androidComponents.sdkComponents.ndkDirectory.get().asFile}"
    }
    tasks.matching { it.name == "pre${variant}Build" }.configureEach { dependsOn zigTask }
}

dependencies {
    implementation files('libs/SDL3-3.4.16.aar')
}
